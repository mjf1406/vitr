# Self-host stack: InstantDB + admin API + SPA.
#   PUBLIC_HOST=<lan-ip-or-localhost> docker compose up -d --build
#   open http://$PUBLIC_HOST:8088
# Instant API: :8888  Dashboard: :3000  Admin: :8787

name: vitr

services:
  postgres:
    image: ghcr.io/instantdb/postgresql:postgresql-17-pg-hint-plan
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_USER: ${POSTGRES_USER:-instant}
      POSTGRES_DB: ${POSTGRES_DB:-instant}
    volumes:
      - backend-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-instant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "shared_preload_libraries=pg_hint_plan"
      - "-c"
      - "random_page_cost=1.1"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BROWSER: "on"
    command: server /data --console-address ":9001" --address ":9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  createbuckets:
    image: minio/mc
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-instant-bucket}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      /usr/bin/mc mb --ignore-existing local/$$S3_BUCKET;
      exit"

  server:
    image: ghcr.io/instantdb/server:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    ports:
      - "${INSTANT_PORT:-8888}:8888"
    environment:
      JAVA_OPTS: ${JAVA_OPTS:--Xmx2g -Xms2g}
      WAL_HISTORY_STORAGE: pg
      DATABASE_URL: "postgresql://${POSTGRES_USER:-instant}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-instant}?sslmode=disable"
      CONNECTION_POOL_SIZE: ${CONNECTION_POOL_SIZE:-20}
      INSTANT_BACKEND_URL: "http://${PUBLIC_HOST:-localhost}:${INSTANT_PORT:-8888}"
      INSTANT_DASHBOARD_URL: "http://${PUBLIC_HOST:-localhost}:${DASHBOARD_PORT:-3000}"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: "http://${PUBLIC_HOST:-localhost}:9000"
      S3_BUCKET: ${S3_BUCKET:-instant-bucket}
    volumes:
      - server_config:/app/resources/config

  www:
    image: ghcr.io/instantdb/dashboard:latest
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      INSTANT_BACKEND_URL: "http://${PUBLIC_HOST:-localhost}:${INSTANT_PORT:-8888}"

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${ADMIN_PORT:-8787}:8787"
    environment:
      ADMIN_PORT: "8787"
      INSTANT_APP_ID: ${INSTANT_APP_ID:-}
      INSTANT_APP_ADMIN_TOKEN: ${INSTANT_APP_ADMIN_TOKEN:-}
      INSTANT_API_URI: http://server:8888
      VITE_SELF_HOSTED: "true"
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_ORGANIZATION_ID: ${POLAR_ORGANIZATION_ID:-}
      POLAR_MONTHLY_PRODUCT_ID: ${POLAR_MONTHLY_PRODUCT_ID:-}
      POLAR_YEARLY_PRODUCT_ID: ${POLAR_YEARLY_PRODUCT_ID:-}

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_INSTANT_APP_ID: ${INSTANT_APP_ID:-}
        VITE_INSTANT_API_URI: http://localhost:8888
        VITE_ADMIN_URL: http://localhost:8787
        VITE_SELF_HOSTED: "true"
    restart: unless-stopped
    depends_on:
      - server
      - admin
    ports:
      - "${WEB_PORT:-8088}:80"
    environment:
      PUBLIC_HOST: "${PUBLIC_HOST:-localhost}"
      INSTANT_PORT: "${INSTANT_PORT:-8888}"
      ADMIN_PORT: "${ADMIN_PORT:-8787}"
      INSTANT_APP_ID: ${INSTANT_APP_ID:-}
      CLASS_PRESENCE_ENABLED: "${CLASS_PRESENCE_ENABLED:-true}"
      VITE_SELF_HOSTED: "true"
      APP_VERSION: "${APP_VERSION:-0.0.0}"

volumes:
  backend-db:
  minio_data:
  server_config:
